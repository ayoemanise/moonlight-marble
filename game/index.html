<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlight &amp; Marble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d13; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Announced to screen readers, never painted: the current heist status line. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Moonlight and Marble: guide the Magpie through the Marlowe Museum, past wardens and cameras, to steal the Celestial Sapphire and reach the getaway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
